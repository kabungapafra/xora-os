# Installer settings for bootc-image-builder (the public ISO).
# The installer opens on the summary screen and only needs two things: the disk ("Installation
# Destination") and your user ("User Creation"). Nothing is erased until you press Begin Installation.
# Language, keyboard and time zone are preset below and can still be changed on the summary screen.
# Uncomment to pre-fill a user instead.
# [[customizations.user]]
# name = "pafra"
# groups = ["wheel"]

[customizations.installer.kickstart]
contents = """
# XORA OS installer
# preset, so the language screen is skipped (it is slow on older PCs) and the summary screen opens directly
lang en_US.UTF-8
keyboard us
timezone UTC --utc
# (no "rootpw --lock": with it the installer let you start without creating any user, which leaves a
#  system nobody can log into. Without it, Begin Installation stays disabled until you create a user;
#  "administrator" is ticked by default and root stays disabled, like Ubuntu.)
# boot straight into the desktop after installing
xconfig --startxonboot
"""

# Installer modules that run. The builder turns most off for image-based systems; the language
# screen sets the time zone from the language and crashes if the Timezone module isn't running.
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Localization",
  "org.fedoraproject.Anaconda.Modules.Timezone",
  "org.fedoraproject.Anaconda.Modules.Users",
]
