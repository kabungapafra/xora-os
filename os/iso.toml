# Installer settings for bootc-image-builder.
# The installer asks for language, disk and user. Uncomment to pre-fill a user instead.
# [[customizations.user]]
# name = "pafra"
# groups = ["wheel"]

[customizations.installer.kickstart]
contents = """
# XORA OS installer
zerombr
clearpart --all --initlabel
autopart --type=btrfs --noswap
firstboot --enable
xconfig --startxonboot
"""

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Users", "org.fedoraproject.Anaconda.Modules.Localization"]
