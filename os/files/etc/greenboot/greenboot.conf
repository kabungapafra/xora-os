# XORA: if a new OS version fails these checks on 3 boots in a row, the previous version comes back by itself.
GREENBOOT_MAX_BOOT_ATTEMPTS=3
GREENBOOT_WATCHDOG_CHECK_ENABLED=true
GREENBOOT_WATCHDOG_GRACE_PERIOD=24
# XORA works offline, so "can I reach the update server" must never count as a broken boot
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "01_update_platforms_check.sh")
