# XORA: encrypted DNS (DNS over TLS) to privacy-respecting resolvers, used for every lookup.
# "opportunistic" falls back to plain DNS on networks that block TLS (hotel and cafe Wi-Fi sign-in pages);
# switch to strict with: xora privacy --dns strict
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 1.1.1.1#cloudflare-dns.com
FallbackDNS=
Domains=~.
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
LLMNR=no
MulticastDNS=no
