# XORA performance: fast internet on real-world links, a responsive desktop on small machines.

# ---- network
# BBR: much higher throughput and lower latency on lossy / high-latency links (4G, busy Wi-Fi)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# reuse TCP connections faster: Fast Open for repeat visits, no slow restart after idle
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
# find the right packet size on networks that break it (common on mobile) instead of stalling
net.ipv4.tcp_mtu_probing = 1
# room for fast links
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 16384
# keep send queues short: lower latency for interactive traffic alongside downloads
net.ipv4.tcp_notsent_lowat = 131072

# ---- memory (swap is compressed RAM: zram)
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.vfs_cache_pressure = 50
