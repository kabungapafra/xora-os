# XORA privacy defaults: networks can't track this computer from place to place.
[device]
wifi.scan-rand-mac-address=yes

[connection]
# a new random hardware (MAC) address on every connection
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=random
# don't announce this computer's name to routers and hotspots
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# IPv6 privacy addresses
ipv6.ip6-privacy=2
connection.llmnr=0
