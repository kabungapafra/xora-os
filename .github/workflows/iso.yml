# Make the installer ISO from the published image (Actions › iso › Run workflow).
# The ISO (~5 GB) is attached to the run as an artifact; GitHub Releases cap files at 2 GB, so for a
# public download mirror it to a host such as SourceForge or archive.org.
name: iso

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag to turn into an ISO"
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - name: build the ISO
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xora-os:${{ inputs.tag }}"
          sudo podman pull "$img"
          mkdir -p output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v ./output:/output -v ./os/iso.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs btrfs --use-librepo=True "$img"
          sudo chown -R "$(id -u):$(id -g)" output
          sudo apt-get install -y -qq xorriso mtools isomd5sum squashfs-tools
          ./iso-relabel.sh output/bootiso/install.iso "xora-os-${{ inputs.tag }}-x86_64.iso"
          sha256sum xora-os-*.iso | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: xora-os-iso
          path: |
            xora-os-*.iso
            SHA256SUMS
          compression-level: 0
          retention-days: 30
