# Build and publish the XORA OS image for every machine (x86_64 and ARM64).
#
#   push to main / weekly  → ghcr.io/<owner>/xora-os:latest (+ :YYYYMMDD), signed with Sigstore (keyless)
#   pull requests          → checks and a test build, nothing published
#
# Installed XORA machines pull :latest at night and keep the previous version for rollback.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "prototype/**", "assets/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"        # Mondays: picks up Fedora's security fixes even without XORA changes
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write               # keyless signing (Sigstore)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: xora command compiles and runs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml
          python3 -m py_compile cli/xora/*.py
          for c in "" space fabric timeline explain data anon vpn tools apps install speed where center; do
            ./cli/xora.sh $c --help >/dev/null
          done
          ./cli/xora.sh status --json | python3 -m json.tool >/dev/null
      - name: shell scripts and launcher files are valid
        run: |
          for f in build.sh build-iso.sh os/files/usr/bin/xora-term os/files/usr/lib/xora/hooks/anon \
                   os/files/usr/lib/xora/hooks/vpn-killswitch os/files/usr/lib/xora/hooks/image-origin; do bash -n "$f"; done
          python3 -m py_compile os/files/usr/lib/xora/hooks/netbudget os/files/usr/lib/xora/hooks/lan-updates
          node --check os/files/usr/share/plasma/look-and-feel/org.xora.desktop/contents/layouts/org.kde.plasma.desktop-layout.js

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: make room (the OS image is ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/xora-os" >> "$GITHUB_OUTPUT"
      - name: build
        run: |
          podman build \
            --build-arg XORA_IMAGE="${{ steps.names.outputs.image }}:latest" \
            --build-arg XORA_VERSION="0.1.${{ github.run_number }}" \
            -f os/Containerfile --build-context cli=cli \
            -t "${{ steps.names.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}" os/
      - name: push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "${{ steps.names.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: one name for both architectures, then sign it
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xora-os"
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman manifest create xora
          for a in amd64 arm64; do
            podman manifest add xora "docker://$img:${{ github.sha }}-$a" || echo "no $a image this time"
          done
          podman manifest push --all xora "docker://$img:latest"
          podman manifest push --all xora "docker://$img:$(date -u +%Y%m%d)"
          echo "IMG=$img" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@v3
      - name: "sign (keyless: anyone can verify it was built by this repository)"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://$IMG:latest")"
          cosign sign --yes "$IMG@$digest"
